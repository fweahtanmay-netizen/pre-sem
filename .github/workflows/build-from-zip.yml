name: Build Windows game from ZIP
on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Extract the source
        shell: pwsh
        run: Expand-Archive -LiteralPath 'Varooom-Windows-Source.zip' -DestinationPath game

      - name: Build the game
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64 || exit /b 1
          call game\build.bat

      - uses: actions/upload-artifact@v4
        with:
          name: Varooom-Trial-Windows-x64
          path: game/Varooom-Trial.exe
          if-no-files-found: error
